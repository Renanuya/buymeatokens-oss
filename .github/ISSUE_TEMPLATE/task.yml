name: Task
description: A planned, scoped piece of work. Mostly used by maintainers.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A checklist that makes "finished" unambiguous.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Pointers to code, related issues, open questions.
