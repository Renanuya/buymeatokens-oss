# Categories for automatically generated release notes (`gh release create --generate-notes`).
changelog:
  categories:
    - title: Security
      labels: ["type: security"]
    - title: New
      labels: ["type: feature"]
    - title: Fixes
      labels: ["type: bug"]
    - title: Documentation
      labels: ["type: docs"]
    - title: Maintenance
      labels: ["*"]
