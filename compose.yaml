# Local development database: `docker compose up -d db`
# POSTGRES_URL=postgres://postgres:postgres@localhost:5432/buymeatokens
# These credentials are for your machine only. Never point the app at a production database.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buymeatokens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buymeatokens"]
      interval: 2s
      start_period: 10s
      timeout: 3s
      retries: 30

volumes:
  db-data:
